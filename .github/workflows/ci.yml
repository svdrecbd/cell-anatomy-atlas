name: Atlas verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: node scripts/verify-corpus-mechanics.mjs
      - run: npm run build
      - run: npm run build:vinext
      - run: npx wrangler deploy --dry-run --config dist/server/wrangler.json
